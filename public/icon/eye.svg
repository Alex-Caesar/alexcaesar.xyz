<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36">
  <defs>
    <radialGradient id="iris-gradient" cx="32" cy="18" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2572b" />
      <stop offset="55%" stop-color="#a5281a" />
      <stop offset="100%" stop-color="#4a0f09" />
    </radialGradient>
  </defs>
  <style>
    .eye-blink {
      transform-box: fill-box;
      transform-origin: center;
