- Monitoring:
    - Prometheus:
        icon: prometheus.png
        description: Metrics collection (SSH tunnel only, not public)
        widget:
          type: prometheus
          url: http://prometheus:9090

    - Grafana:
        icon: grafana.png
        href: https://grafana.alexcaesar.xyz
        description: Dashboards
        widget:
          type: grafana
          url: http://grafana:3000
          username: '{{HOMEPAGE_VAR_GRAFANA_USER}}'
          password: '{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}'
          fields: ["dashboards", "datasources", "totalalerts", "alertstriggered"]

    - Caddy:
        icon: caddy.png
        href: https://alexcaesar.xyz
        description: Reverse proxy / web server
        widget:
          type: caddy
          url: http://172.18.0.1:2019
